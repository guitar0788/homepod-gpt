services:
  - type: web
    name: homepod-gpt
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    envVars:
      - key: ASSISTANT_TOKEN
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: OPENROUTER_ENABLED
        value: "1"
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENROUTER_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
