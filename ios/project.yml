name: PrivateAssistant
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
targets:
  PrivateAssistant:
    type: application
    platform: iOS
    sources:
      - path: PrivateAssistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homepodgpt.privateassistant
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 私人助手
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_NSHealthShareUsageDescription: 仅在设备上读取您授权的步数、步行距离及活动能量，用于今日健康语音报告，不上传云端。
        CODE_SIGN_ENTITLEMENTS: PrivateAssistant/PrivateAssistant.entitlements
        INFOPLIST_KEY_NSAppleMusicUsageDescription: 用于您主动要求的音乐搜索和播放控制。
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "3"
