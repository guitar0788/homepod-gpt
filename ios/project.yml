name: PrivateAssistant
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
targets:
  PrivateAssistant:
    type: application
    platform: iOS
    sources:
      - path: PrivateAssistant
    info:
      path: GeneratedInfo.plist
      properties:
        NSAlarmKitUsageDescription: 用于您主动要求设置的家庭助手手机闹钟。
        NSContactsUsageDescription: 用于您主动查找授权范围内的联系人，本机读取，不上传云端。
        NSPhotoLibraryUsageDescription: 用于您主动统计授权范围内的照片和视频，本机只读，不上传云端。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homepodgpt.privateassistant
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 私人助手
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_NSHealthShareUsageDescription: 仅读取您分组授权的活动、心肺、睡眠、身体测量及生活健康记录，用于本机健康报告，不上传云端。
        CODE_SIGN_ENTITLEMENTS: PrivateAssistant/PrivateAssistant.entitlements
        INFOPLIST_KEY_NSAppleMusicUsageDescription: 用于您主动要求的音乐搜索和播放控制。
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: 用于您主动要求查看的本机日历日程，不上传云端。
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: 用于您主动要求创建的本机提醒事项，不上传云端。
        INFOPLIST_KEY_NSAlarmKitUsageDescription: 用于您主动要求设置的家庭助手手机闹钟。
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "12"
